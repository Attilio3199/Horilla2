# Production overlay for Horilla2.
#
# Usage:
#   cp .env.dist .env
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# The names, volumes, paths and host ports intentionally remain independent
# from the legacy Horilla deployment.
name: horilla2

services:
  horilla2-server:
    environment:
      DEBUG: "0"
      HORILLA_ENV: production
    volumes: !override
      - horilla2_staticfiles:/app/staticfiles
      - horilla2_media:/app/media
    ports: !override
      - "${DOCKER_PORT:-8002}:8002"

  horilla2-db:
    volumes: !override
      - horilla2_postgres_data:/var/lib/postgresql/data
    ports: !override
      - "127.0.0.1:${DB_PORT:-5433}:5433"

volumes:
  horilla2_staticfiles:
  horilla2_media:
  horilla2_postgres_data:
