{% load i18n %}
<div class="oh-modal__dialog-header"><h2 class="oh-modal__dialog-title">{% trans "Contract import result" %}</h2><button class="oh-modal__close" aria-label="Close"><ion-icon name="close-outline"></ion-icon></button></div>
<div class="oh-modal__dialog-body">
  <p>{% trans "Created" %}: {{ created }} · {% trans "Updated" %}: {{ updated }}</p>
  {% if errors %}<ul class="errorlist">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
